name: Deploy preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Reconstruct site and commit binaries
        run: |
          set -euo pipefail
          test -f payload/COMPLETE
          expected=$(awk -F= '/^sha256=/{print $2}' payload/COMPLETE)
          parts=$(awk -F= '/^parts=/{print $2}' payload/COMPLETE)
          mkdir -p _unpack
          cat payload/part-* | base64 -d > "$RUNNER_TEMP/site.tgz"
          actual=$(sha256sum "$RUNNER_TEMP/site.tgz" | awk '{print $1}')
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"
          test "$(ls payload/part-* | wc -l)" -eq "$parts"
          tar -xzf "$RUNNER_TEMP/site.tgz" -C _unpack
          test -f _unpack/index.html
          test -f _unpack/stormvloed-demo.mp4
          test -f _unpack/hero-still.jpg
          test -f _unpack/sw.js
          test -f _unpack/manifest.webmanifest
          cp -a _unpack/. .
          rm -rf _unpack
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish reconstructed FilmForge preview site"
            git push
          fi
